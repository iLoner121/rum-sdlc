name: RumSDLC release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rumsdlc-release
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      prepare: ${{ steps.plan.outputs.prepare }}
      publish: ${{ steps.plan.outputs.publish }}
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      pr: ${{ steps.plan.outputs.pr }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release.py plan
  prepare:
    needs: plan
    if: needs.plan.outputs.prepare == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
          skip-github-release: true
          release-as: ${{ needs.plan.outputs.version }}
      - name: Test the generated PR explicitly
        if: steps.release.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.release.outputs.pr }}
          REPO: ${{ github.repository }}
        run: |
          branch=$(python3 -c 'import json,os; print(json.loads(os.environ["PR"])["headBranchName"])')
          gh workflow run native.yml --repo "$REPO" --ref "$branch"
  package:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build fixed stable distribution
        env:
          SOURCE_SHA: ${{ needs.plan.outputs.sha }}
        run: go run ./cmd/build --channel stable --commit "$SOURCE_SHA"
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: rumsdlc-release-candidate-${{ github.run_attempt }}
          path: build/native/
          if-no-files-found: error
  test:
    needs: [plan, package]
    if: needs.plan.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - run: go test -race -count=1 ./...
      - run: go vet ./...
      - run: python3 -m unittest discover -s .github/scripts -p "*_test.py"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: release-workflow
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.package.outputs.artifact-id }}
          merge-multiple: true
          path: build/native/
      - name: Run the packaged CLI
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.plan.outputs.sha }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: python3 release-workflow/.github/scripts/release.py smoke-package "$SOURCE_SHA" "$RELEASE_VERSION"
  publish:
    needs: [plan, package, test]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.package.outputs.artifact-id }}
          merge-multiple: true
          path: build/native/
      - name: Publish complete immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.plan.outputs.sha }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_PR: ${{ needs.plan.outputs.pr }}
        run: |
          chmod +x "build/native/$RELEASE_VERSION/rum-linux-amd64"
          python3 .github/scripts/release.py publish "$SOURCE_SHA" "$RELEASE_VERSION" "$RELEASE_PR"
