name: RumSDLC release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rumsdlc-release
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      prepare: ${{ steps.plan.outputs.prepare }}
      publish: ${{ steps.plan.outputs.publish }}
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      pr: ${{ steps.plan.outputs.pr }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release.py plan
  prepare:
    needs: plan
    if: needs.plan.outputs.prepare == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
          skip-github-release: true
          release-as: ${{ needs.plan.outputs.version }}
      - name: Test the generated PR explicitly
        if: steps.release.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.release.outputs.pr }}
          REPO: ${{ github.repository }}
        run: |
          branch=$(python3 -c 'import json,os; print(json.loads(os.environ["PR"])["headBranchName"])')
          gh workflow run native.yml --repo "$REPO" --ref "$branch"
  test:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - run: go test -race -count=1 ./...
      - run: go vet ./...
      - run: python3 -m unittest discover -s .github/scripts -p "*_test.py"
      - run: go build -trimpath ./cmd/rum
      - shell: bash
        run: |
          if [ -f rum.exe ]; then ./rum.exe version; else ./rum version; fi
  publish:
    needs: [plan, test]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Build fixed stable distribution
        env:
          SOURCE_SHA: ${{ needs.plan.outputs.sha }}
        run: go run ./cmd/build --channel stable --commit "$SOURCE_SHA"
      - name: Publish complete immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.plan.outputs.sha }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_PR: ${{ needs.plan.outputs.pr }}
        run: python3 .github/scripts/release.py publish "$SOURCE_SHA" "$RELEASE_VERSION" "$RELEASE_PR"
