name: Native system
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - run: git --version
      - run: go test -race -count=1 ./...
      - run: go vet ./...
      - run: python3 -m unittest discover -s .github/scripts -p "*_test.py"
      - run: go build -trimpath ./cmd/rum
      - shell: bash
        run: |
          if [ -f rum.exe ]; then ./rum.exe --version; else ./rum --version; fi
  distribution:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - run: go run ./cmd/build
      - uses: actions/upload-artifact@v4
        with:
          name: rumsdlc-native
          path: build/native/
